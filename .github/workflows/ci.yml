name: Public Job Radar Unit Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_RADAR_PROFILE_PATH: tests/fixtures/resume_profile.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q run.py crossboard tests
      - name: Run offline unit tests (no private data or credentials)
        run: python -m unittest discover -s tests -v
