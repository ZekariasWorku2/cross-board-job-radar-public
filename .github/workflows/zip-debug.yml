name: ZipRecruiter MCP Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/zip-debug-trigger']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Probe ZipRecruiter with MCP 2025-03-26
        run: |
          python - <<'PY'
          import json, requests

          url="https://api.ziprecruiter.com/mcp"
          common={"Accept":"application/json, text/event-stream","Content-Type":"application/json"}

          def decode(response):
              text=response.text
              if "text/event-stream" in response.headers.get("content-type",""):
                  payloads=[]
                  for line in text.splitlines():
                      if line.startswith("data:"):
                          raw=line[5:].strip()
                          if raw:
                              try: payloads.append(json.loads(raw))
                              except Exception: pass
                  return payloads
              try: return [response.json()]
              except Exception: return [{"raw":text[:3000]}]

          init={
              "jsonrpc":"2.0","id":1,"method":"initialize",
              "params":{
                  "protocolVersion":"2025-03-26",
                  "capabilities":{},
                  "clientInfo":{"name":"cross-board-job-radar","version":"1.0"}
              }
          }
          r=requests.post(url,headers=common,json=init,timeout=20)
          print("initialize_status",r.status_code)
          print("initialize_content_type",r.headers.get("content-type"))
          print("initialize_session",bool(r.headers.get("mcp-session-id")))
          print("initialize_body",json.dumps(decode(r),default=str)[:5000])
          r.raise_for_status()
          sid=r.headers.get("mcp-session-id")
          headers=dict(common)
          if sid: headers["Mcp-Session-Id"]=sid
          headers["MCP-Protocol-Version"]="2025-03-26"

          requests.post(url,headers=headers,json={"jsonrpc":"2.0","method":"notifications/initialized"},timeout=20)

          r=requests.post(url,headers=headers,json={"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},timeout=20)
          print("tools_status",r.status_code)
          payload=decode(r)
          print("tools_body",json.dumps(payload,default=str)[:8000])
          r.raise_for_status()

          tool=None
          for envelope in payload:
              for candidate in ((envelope.get("result") or {}).get("tools") or []):
                  if candidate.get("name")=="search_jobs":
                      tool=candidate
          if not tool:
              raise RuntimeError("search_jobs was not returned")
          schema=tool.get("inputSchema") or {}
          props=schema.get("properties") or {}
          print("schema",json.dumps(schema,sort_keys=True))

          args={}
          for name in ("keyword","query","search_term","q"):
              if name in props:
                  args[name]="Data Engineer"; break
          if "country" in props: args["country"]="US"
          if "country_code" in props: args["country_code"]="US"
          if "workplace_types" in props: args["workplace_types"]=["Remote"]
          elif "workplace_type" in props: args["workplace_type"]="Remote"
          elif "remote" in props: args["remote"]=True
          elif "remote_only" in props: args["remote_only"]=True
          elif "location" in props: args["location"]="Remote"
          if "posted_within_days" in props: args["posted_within_days"]=1
          if "posted_date" in props:
              enum=(props["posted_date"] or {}).get("enum") or []
              args["posted_date"]="ONE" if not enum or "ONE" in enum else enum[0]
          if "limit" in props: args["limit"]=min(5,int((props["limit"] or {}).get("maximum",5)))
          if "max_results" in props: args["max_results"]=min(5,int((props["max_results"] or {}).get("maximum",5)))
          if "offset" in props: args["offset"]=0
          print("args",json.dumps(args,sort_keys=True))

          call={"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search_jobs","arguments":args}}
          r=requests.post(url,headers=headers,json=call,timeout=30)
          print("call_status",r.status_code)
          print("call_body",json.dumps(decode(r),default=str)[:10000])
          r.raise_for_status()
          PY
